<html lang="en">

<head>
  <link rel="stylesheet" type="text/css" href="../css/index.css" />
  <style>
    body {
      overflow: hidden;
    }

    .box_model_class {
      box-sizing: border-box;
    }

    .margin_container {
      margin: 40px;
      color: #000;
      outline: 10px solid #23c9ff;
      box-shadow: 10px 2px 5px black;
    }

    .border_container {
      border: 10px solid white;
    }

    .padding_container {
      padding: 30px;
      background-color: blueviolet;
    }

    .content_container {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: aqua;
      height: 100px;
      color: #232323;
    }
  </style>
</head>

<body>
  <div class="box_model_class">
    <slot name="box-model-container">
      <span>margin area</span>
      <div class="margin_container">
        <div class="border_container">
          <div class="padding_container">
            <span>padding area</span>
            <slot class="content_container" name="content-container"> </slot>
          </div>
        </div>
      </div>
    </slot>
  </div>
</body>

</html>
